name: Atualizar Dados Status Invest

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Quantidade de ativos por execução"
        required: false
        default: "40"

jobs:
  coletar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar coleta Status Invest
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '40' }}
        run: python coleta.py

      - name: Commit e push de dados.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add dados.json
          if git diff --staged --quiet; then
            echo "Sem alterações em dados.json"
            exit 0
          fi
          git commit -m "chore: atualiza dados do Status Invest"
          git push origin main
