<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar — Status Invest</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
    }
    h1 { margin: 0 0 6px 0; font-size: 24px; color: #f8fafc; }
    .resumo {
      margin-bottom: 14px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }
    .controles {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    input, select, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 14px;
    }
    button {
      cursor: pointer;
      background: #1d4ed8;
      border-color: #2563eb;
      font-weight: 600;
    }
    .tabela-wrap {
      width: 100%;
      overflow-x: auto;
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #334155;
      text-align: left;
      font-size: 14px;
    }
    th { background: #020617; color: #94a3b8; }
    tr:last-child td { border-bottom: none; }
    .ok { color: #4ade80; font-weight: 700; }
    .nodata { color: #facc15; }
    .neterr, .limit { color: #f87171; }
    .sinal-comprar { color: #4ade80; font-weight: 700; }
    .sinal-aguardar { color: #38bdf8; font-weight: 600; }
    .sinal-caro { color: #facc15; font-weight: 700; }
    .sinal-vender { color: #f87171; font-weight: 700; }
    .sinal-sem { color: #94a3b8; }
    a { color: #38bdf8; text-decoration: none; }
    .vazio { text-align: center; padding: 24px; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Radar — Status Invest</h1>
  <div id="resumo" class="resumo">Carregando dados.json...</div>

  <div class="controles">
    <input id="busca" type="text" placeholder="Filtrar ticker (ex.: PETR4, MXRF11)..." />
    <select id="filtroSinal">
      <option value="all">Todas indicações</option>
      <option value="Comprar">Comprar</option>
      <option value="Aguardar">Aguardar</option>
      <option value="Caro">Caro</option>
      <option value="Vender">Vender</option>
    </select>
    <select id="filtroStatus">
      <option value="all">Todos os status</option>
      <option value="ok">ok</option>
      <option value="nodata">nodata</option>
      <option value="neterr">neterr</option>
      <option value="limit">limit</option>
    </select>
    <button id="btnRecarregar" type="button">Atualizar</button>
  </div>

  <div class="tabela-wrap">
    <table>
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Tipo</th>
          <th>Status</th>
          <th>Indicação</th>
          <th>Indicadores</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="corpo">
        <tr><td colspan="6" class="vazio">Carregando...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    let todosItens = [];

    function esc(v) {
      return String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function classeSinal(sinal) {
      if (sinal === "Comprar") return "sinal-comprar";
      if (sinal === "Aguardar") return "sinal-aguardar";
      if (sinal === "Caro") return "sinal-caro";
      if (sinal === "Vender") return "sinal-vender";
      return "sinal-sem";
    }

    function resumir(dataObj) {
      if (!dataObj || typeof dataObj !== "object") return "-";
      const chaves = Object.keys(dataObj);
      if (!chaves.length) return "-";
      return chaves
        .slice(0, 5)
        .map((k) => `${esc(k)}: ${esc(dataObj[k]?.raw ?? "-")}`)
        .join(" | ");
    }

    function renderizar() {
      const q = document.getElementById("busca").value.trim().toUpperCase();
      const sinal = document.getElementById("filtroSinal").value;
      const st = document.getElementById("filtroStatus").value;
      const corpo = document.getElementById("corpo");

      const filtrados = todosItens.filter((item) => {
        const tk = String(item.ticker || "").toUpperCase();
        const matchTicker = !q || tk.includes(q);
        const matchSinal = sinal === "all" || (item.sinal || "Sem dados") === sinal;
        const matchStatus = st === "all" || item.status === st;
        return matchTicker && matchSinal && matchStatus;
      });

      if (!filtrados.length) {
        corpo.innerHTML = `<tr><td colspan="6" class="vazio">Nenhum item encontrado.</td></tr>`;
        return;
      }

      corpo.innerHTML = filtrados.map((item) => {
        const s = item.sinal || "Sem dados";
        const link = item.url && /^https?:\/\//i.test(item.url)
          ? `<a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">Abrir</a>`
          : "-";

        return `
          <tr>
            <td><strong>${esc(item.ticker)}</strong></td>
            <td>${esc(item.type || "-")}</td>
            <td class="${esc(item.status || "")}">${esc(item.status || "-")}</td>
            <td class="${classeSinal(s)}">${esc(s)}</td>
            <td>${resumir(item.data)}</td>
            <td>${link}</td>
          </tr>
        `;
      }).join("");
    }

    async function carregar() {
      try {
        const res = await fetch(`./dados.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        const itemsObj = json && typeof json.items === "object" && json.items !== null ? json.items : {};

        todosItens = Object.entries(itemsObj).map(([k, v]) => ({
          ticker: (v && v.ticker) || k,
          ...(v && typeof v === "object" ? v : {}),
        }));

        const stats = json.stats || {};
        document.getElementById("resumo").textContent =
          `Atualizado em: ${json.updatedAt || "-"} | Total: ${stats.total ?? todosItens.length} | ` +
          `OK: ${stats.ok ?? 0} | Sem dados: ${stats.nodata ?? 0} | ` +
          `Erro rede: ${stats.neterr ?? 0} | Limite: ${stats.limit ?? 0}`;

        renderizar();
      } catch (err) {
        document.getElementById("resumo").textContent = `Falha ao carregar dados.json: ${err.message || err}`;
        document.getElementById("corpo").innerHTML =
          `<tr><td colspan="6" class="vazio">Erro ao ler dados.json.</td></tr>`;
      }
    }

    document.getElementById("busca").addEventListener("input", renderizar);
    document.getElementById("filtroSinal").addEventListener("change", renderizar);
    document.getElementById("filtroStatus").addEventListener("change", renderizar);
    document.getElementById("btnRecarregar").addEventListener("click", carregar);

    carregar();
  </script>
</body>
</html>
