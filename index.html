<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Avenir Next","Segoe UI",Helvetica,Arial,sans-serif}

main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:22px;color:var(--ac);margin:4px 0 14px;font-weight:600}h3{font-size:15px;margin:0 0 10px}

.lgo{border-radius:14px;background:#fff;object-fit:contain;padding:2px;flex:none}.lgf{display:grid;place-items:center;border-radius:14px;background:var(--cd2);color:var(--ac);font-weight:700;font-size:13px;flex:none}.rkb{position:absolute;left:-7px;top:-7px;width:18px;height:18px;font-size:10px}

body[data-vis=lista] .grid{grid-template-columns:1fr;max-width:760px;gap:2px}body[data-vis=lista] .cd{background:transparent;border-radius:0;border-bottom:1px solid #4a5060;padding:14px 4px}body[data-vis=lista] .cd.exc{background:rgba(224,176,80,.08)}

</style></head><body>
<header><div class="top">
<svg class="logo" viewBox="0 0 32 32" fill="none" stroke="#7dd3c0" stroke-width="2.2"><path d="M16 3 4 7v9c0 7 5 11 12 13 7-2 12-6 12-13V7z"/><path d="M10 17c4 0 6-3 6-7 0 4 2 7 6 7M16 16v8"/></svg>
<a data-v="top">Investimentos</a><a data-v="rec" class="rec">Recomendação</a><a data-v="cfg">Ajustes</a><span class="sp"></span><button class="btn" id="upd">Atualizar agora</button></div>
<div class="sub" id="sub"><a data-v="top">Top 20</a><a data-v="set">Por setor</a><a data-v="all">Todas</a><a data-v="cart">Carteira</a><a data-v="renda">Renda</a></div></header>
<div id="st">Carregando…</div>
<main id="m"></main>
<script>
const DEFTOK="7XnqyWJBnSnqEhYotwxogQ";
const DEF="TAEE11 CMIG4 BBAS3 ISAE4 BBSE3 CPFE3 BBDC4 ITUB4 KLBN4 PETR4 VALE3 TRPL4 CXSE3 SAPR11 EGIE3 ITSA4 VIVT3 CSMG3 CPLE6 ALUP11 FLRY3 SANB11 WEGE3 TIMS3 ABCB4 BRSR6 CMIN3 GOAU4 SUZB3 LEVE3".split(" ");
const K="radar_v2",$=s=>document.querySelector(s);
const defS=()=>({v:5,plAlvo:10,liqMin:1000000,brLim:15000,detHoras:18,token:"",dbKey:"",brapiDiv:false,dy:6,desc:20,anos:5,lucro:30,watch:DEF,pos:[],dbLim:190,minAnos:4,rk:"nota",nSet:7,sched:{on:true,times:["14:00","18:30"],days:[1,2,3,4,5],divDias:7,gap:600,conc:1,minManual:2}});
const old=JSON.parse(localStorage.getItem("radar_v1")||"null");
let S=Object.assign(defS(),JSON.parse(localStorage.getItem(K)||"null")||old||{});
const legacy=S.cache,legacyAt=S.upd;delete S.cache;delete S.upd;S.sched=Object.assign(defS().sched,S.sched);
if((S.v||0)<5){S.v=5;S.nSet=7;S.rk="nota";S.sched.gap=Math.max(S.sched.gap||0,1200);if(JSON.stringify(S.sched.times)=='["10:00","13:00","16:30"]')S.sched.times=["14:00","18:30"]}
if(!["nota","margem"].includes(S.rk))S.rk="nota";
const divSrc=()=>S.brapiDiv||!!S.dbKey;
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const R=v=>v==null||isNaN(v)?"-":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const P=v=>v==null||isNaN(v)?"-":v.toLocaleString("pt-BR",{maximumFractionDigits:2})+"%";
const cls=v=>v>=0?"pos":"neg",COL=["#72b5ab","#fadba0","#e0b050","#8fa8e8","#d98fb0","#a6d98f","#c9a2e8","#e89f8f","#8fd9d9","#b0b0b0","#f0e68c"];
let view="top";

/* ===== Cache persistente (IndexedDB) ===== */
let C={},ST={},M={qAt:0,dAt:0,lastTry:0,skip:0,api:{m:"",n:0},db:{d:"",n:0},gm:{d:"",n:0},err:null,ultimo:null},DB=null,idbOk=false;
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("radar",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kvGet=k=>new Promise(ok=>{try{const q=DB.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok()}catch(e){ok()}});
const kvSet=(k,v)=>new Promise(ok=>{try{const t=DB.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=ok;t.onerror=ok}catch(e){ok()}});
let tmr;const persist=()=>{clearTimeout(tmr);tmr=setTimeout(flush,300)};
async function flush(){if(!idbOk)return;await kvSet("cache",C);await kvSet("meta",{ST,M});
  await kvSet("analise",{at:Date.now(),items:[...new Set([...S.watch,...S.pos.map(p=>p.t)])].map(calc).filter(Boolean)})}
const brt=ts=>new Date((ts||Date.now())-3*36e5);
const fimDeSemana=()=>{const d=brt().getUTCDay();return d==0||d==6};
function lastClose(){const b=brt();for(let i=0;i<8;i++){const x=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),b.getUTCDate()-i)),w=x.getUTCDay();if(w==0||w==6)continue;
  const ts=Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate(),21,0);if(ts<=Date.now())return ts}return 0}
const fmtDia=ts=>new Date(ts-3*36e5).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"2-digit",timeZone:"UTC"});
function fase(){const b=brt(),w=b.getUTCDay(),h=b.getUTCHours()+b.getUTCMinutes()/60;
  if(w==0||w==6)return"Mercado fechado (fim de semana): dados do fechamento de "+fmtDia(lastClose());
  if(h<10)return"Antes da abertura: dados do fechamento de "+fmtDia(lastClose());
  return h<18?"Pregão em andamento":"Pós-fechamento"}
function diasUteis(){const b=brt(),y=b.getUTCFullYear(),m=b.getUTCMonth(),u=new Date(Date.UTC(y,m+1,0)).getUTCDate();let n=0;
  for(let d=b.getUTCDate();d<=u;d++){const w=new Date(Date.UTC(y,m,d)).getUTCDay();if(w>0&&w<6)n++}return Math.max(1,n)}
function cntInit(){const mk=new Date().toISOString().slice(0,7),hj=new Date().toISOString().slice(0,10);
  if(M.api.m!=mk)M.api={m:mk,n:0,dd:"",d0:0};if(M.api.dd!=hj){M.api.dd=hj;M.api.d0=M.api.n}}
const cnt=()=>{cntInit();M.api.n++};
function restanteHoje(){cntInit();const res=Math.ceil(S.brLim*0.1),perm=Math.floor((S.brLim-res-M.api.d0)/diasUteis());return Math.max(0,perm-(M.api.n-M.api.d0))}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=ts=>ts?new Date(ts).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"nunca";

/* ===== Consulta à brapi: classifica cada resultado ===== */
class E extends Error{constructor(s,m,h){super(m);this.s=s;this.h=h}}
async function fetchOne(t,wd,mods){
  cnt();
  let r;try{r=await fetch(`https://brapi.dev/api/quote/${t}?${wd?"dividends=true&":""}${mods?"modules=defaultKeyStatistics,financialData&":""}token=${S.token||DEFTOK}`)}
  catch(e){throw new E("neterr","falha de rede ou bloqueio CORS ("+(e.message||e)+")")}
  const h=r.status;let j=null;try{j=await r.json()}catch(e){}
  const msg=(j&&j.message)||"";
  if(h==429||h==402)throw new E("limit","limite de requisições (HTTP "+h+") "+msg,h);
  if(h==401||h==403)throw new E("auth","token recusado ou plano sem acesso (HTTP "+h+") "+msg,h);
  if(h==404)throw new E("nodata","ticker não encontrado na fonte "+msg,h);
  if(h>=500)throw new E("neterr","erro temporário do servidor (HTTP "+h+")",h);
  if(!j||typeof j!="object")throw new E("invalid","resposta não é JSON válido (HTTP "+h+")",h);
  const x=j.results&&j.results[0];
  if(!x){if(j.error||msg)throw new E(/token|auth|plano|plan/i.test(msg)?"auth":"invalid",msg||"erro na resposta",h);throw new E("nodata","a fonte não devolveu resultados",h)}
  if(typeof x.regularMarketPrice!="number")throw new E("invalid","cotação ausente na resposta",h);
  let lo=x.fiftyTwoWeekLow,hi=x.fiftyTwoWeekHigh;
  if(lo==null&&x.fiftyTwoWeekRange){const m=x.fiftyTwoWeekRange.split("-").map(Number);lo=m[0];hi=m[1]}
  const o={p:x.regularMarketPrice,ch:x.regularMarketChangePercent,nome:x.shortName||t,lo,hi,pl:Number.isFinite(x.priceEarnings)?x.priceEarnings:null,eps:Number.isFinite(x.earningsPerShare)?x.earningsPerShare:null,logo:x.logourl||null};
  if(mods){const dk=[].concat(x.defaultKeyStatistics||[])[0]||{},fd=[].concat(x.financialData||[])[0]||{},nz=v=>Number.isFinite(v)?v:null;let re=nz(fd.returnOnEquity);if(re!=null&&Math.abs(re)<=1.5)re*=100;o.roe=re;o.pvp=nz(dk.priceToBook)}
  if(wd)o.div=((x.dividendsData&&x.dividendsData.cashDividends)||[]).map(d=>({v:d.rate,d:d.paymentDate||d.lastDatePrior||d.approvedOn}));
  return o}
async function fetchDet(t){ /* tenta trazer ROE e P/VP junto da mesma chamada; se o plano recusar, refaz sem módulos e não pede mais */
  if(S.modOK!==false){try{const r=await fetchOne(t,false,true);if(S.modOK!==true){S.modOK=true;save()}return r}
    catch(e){if(e.h!=403&&e.h!=400)throw e;const r=await fetchOne(t,false,false);S.modOK=false;save();return r}}
  return fetchOne(t,false,false)}
async function fetchDivDB(t){
  const dk=new Date().toISOString().slice(0,10);if(M.db.d!=dk)M.db={d:dk,n:0};M.db.n++;
  let r;try{r=await fetch(`https://dadosb3.com/empresas/${t}/dividendos`,{headers:{"X-API-Key":S.dbKey}})}
  catch(e){throw new E("neterr","dadosb3: falha de rede ou bloqueio CORS ("+(e.message||e)+")")}
  const h=r.status;let j=null;try{j=await r.json()}catch(e){}
  if(h==429)throw new E("limit","dadosb3: limite diário da chave atingido (HTTP 429)",h);
  if(h==401)throw new E("auth","dadosb3: chave ausente ou inválida (HTTP 401)",h);
  if(h==404)throw new E("nodata","dadosb3: ticker não encontrado",h);
  if(h>=500)throw new E("neterr","dadosb3: erro temporário (HTTP "+h+")",h);
  if(!j||!Array.isArray(j.proventos))throw new E("invalid","dadosb3: resposta sem lista de proventos (HTTP "+h+")",h);
  const cl=/3$/.test(t)?/^ON/i:/[4-8]$/.test(t)?/^PN/i:/11$/.test(t)?/UN/i:null;
  if(!cl)throw new E("invalid","classe do ticker não identificada",h);
  if(j.proventos.length&&!j.proventos.some(x=>cl.test(x.tipo_acao||"")))throw new E("invalid","dadosb3: nenhum provento da classe de "+t+" (tipo_acao inesperado)",h);
  const ok=/DIVID|JCP|JUROS|REND/i;
  return j.proventos.filter(x=>cl.test(x.tipo_acao||"")&&x.valor>0&&x.data_com&&ok.test((x.tipo||"")+" "+(x.acao_corporativa||""))).map(x=>({v:x.valor,d:x.data_com}))}
function merge(t,n){const o=C[t]||{},now=Date.now();
  C[t]={...o,p:n.p,ch:n.ch,nome:n.nome,lo:n.lo??o.lo,hi:n.hi??o.hi,loAt:n.lo!=null?now:o.loAt,pl:n.pl,eps:n.eps,roe:n.roe??o.roe,pvp:n.pvp??o.pvp,logo:n.logo||o.logo,detAt:now,qAt:now,src:"brapi"};
  if(n.div){C[t].div=n.div;C[t].dAt=now;C[t].dsrc="brapi.dev"}}

/* ===== Fila única, sem consultas simultâneas duplicadas ===== */
let run=null;
function refresh(o={}){
  if(run)return run;
  $("#upd").disabled=true;
  run=doRefresh(o).catch(e=>{M.err={msg:String(e),src:"app",at:Date.now()}}).finally(()=>{run=null;$("#upd").disabled=false;persist();draw();status()});
  return run}
function chk(h,j,pre){const m=(j&&j.message)||"";
  if(h==429||h==402)throw new E("limit",pre+"limite de requisições (HTTP "+h+") "+m,h);
  if(h==401||h==403)throw new E("auth",pre+"token recusado ou plano sem acesso (HTTP "+h+") "+m,h);
  if(h==404)throw new E("nodata",pre+"não encontrado "+m,h);
  if(h>=500)throw new E("neterr",pre+"erro temporário do servidor (HTTP "+h+")",h);
  if(h>=400)throw new E("invalid",pre+"requisição recusada (HTTP "+h+") "+m,h)}
async function viaRetry(fn){for(let k=0;;k++){try{return await fn()}catch(e){
  if(e.s=="neterr"&&k<2){await sleep(1000*3**(k+1));continue}
  if(e.s=="limit"&&e.h==429&&k<1){await sleep(5000);continue}throw e}}}
async function listaGet(q){cnt();let r;
  try{r=await fetch("https://brapi.dev/api/quote/list?type=stock"+q)}catch(e){throw new E("neterr","falha de rede ou bloqueio CORS ("+(e.message||e)+")")}
  let j=null;try{j=await r.json()}catch(e){}chk(r.status,j,"lista: ");
  if(!j||!Array.isArray(j.stocks))throw new E("invalid","lista sem o campo stocks (HTTP "+r.status+")",r.status);return j}
async function fetchList(){ /* uma chamada traz cotação, volume e setor de todo o mercado */
  const j=await listaGet("&sortBy=volume&sortOrder=desc"),now=Date.now();let n=0;
  j.stocks.forEach(x=>{const t=x.stock;if(!/^[A-Z]{4}(3|4|5|6|11)$/.test(t||"")||typeof x.close!="number"||x.close<=0||(x.subType&&x.subType!="stock"&&x.subType!="unit"))return;const o=C[t]||{};
    C[t]={...o,p:x.close,ch:x.change,nome:o.nome&&o.nome!=t?o.nome:(x.name&&x.name!=t?x.name:t),sec:x.sector||o.sec,lname:x.name,logo:x.logo||o.logo,vol:x.volume||0,qAt:now,src:"brapi"};n++});
  if(Array.isArray(j.availableSectors))M.setores=j.availableSectors;
  const faltam=()=>Object.keys(C).filter(t=>!C[t].sec).length; /* setor ausente: classifica pelo filtro de setor da própria API */
  if(faltam()&&M.setores&&Date.now()-(M.secAt||0)>864e5){M.secAt=Date.now();
    for(const sec of M.setores){if(!faltam())break;try{(await listaGet("&sector="+encodeURIComponent(sec))).stocks.forEach(x=>{if(C[x.stock]&&!C[x.stock].sec)C[x.stock].sec=sec})}catch(e){break}await sleep(S.sched.gap)}}
  return n}
async function runIndiv(ts){let ok=0,fail=0,stop=false;
  for(const t of ts){if(stop)break;status(`Detalhes de ${t}…`);
    try{merge(t,await viaRetry(()=>fetchDet(t)));ST[t]={...(ST[t]||{}),s:"ok",at:Date.now(),err:null};ok++}
    catch(e){const s=e.s||"neterr";ST[t]={...(ST[t]||{}),s,at:Date.now(),err:e.message};M.err={msg:t+": "+e.message,src:"brapi.dev",at:Date.now(),s};fail++;if(s=="limit")stop=true}
    await sleep(S.sched.gap)}
  return{ok,fail}}
async function runDiv(o,now){ /* dividendos aos poucos: respeita o limite diário da chave */
  if(!divSrc())return{ok:0,fail:0,left:0};
  const sc=S.sched,dv=sc.divDias*864e5,lim=S.dbLim||190,dk=new Date().toISOString().slice(0,10);
  if(M.db.d!=dk)M.db={d:dk,n:0};
  const E_={};Object.keys(C).forEach(t=>(E_[EMP(t)]=E_[EMP(t)]||[]).push(t));
  const pri=new Set(S.pos.map(p=>p.t)),cs=new Set();
  if(!o.only){const G={};rankAll(true).forEach(x=>(G[x.sec]=G[x.sec]||[]).push(x.t));Object.values(G).forEach(L=>L.slice(0,S.nSet).forEach(t=>cs.add(t)));rankAll().slice(0,20).forEach(x=>cs.add(x.t))}
  const onlyE=new Set((o.only&&!o.divAll?o.only.filter(t=>pri.has(t)):[...pri,...cs]).map(EMP));if(!onlyE.size)return{ok:0,fail:0,left:0};
  const sc2=t=>(pri.has(t)?2e12:0)+(C[t].vol||0)+(t.endsWith("4")?0.2:t.endsWith("3")?0.1:0);
  const need=[];
  for(const [e,ts] of Object.entries(E_)){
    if(onlyE&&!onlyE.has(e))continue;
    if(!o.divAll&&ts.some(t=>C[t].dAt&&now-C[t].dAt<=dv))continue;
    const rep=ts.slice().sort((a,b)=>sc2(b)-sc2(a))[0],x=ST[rep]&&ST[rep].dv;
    if(!o.divAll&&x&&(x.s=="nodata"||x.s=="invalid")&&now-x.at<7*864e5)continue;
    need.push(rep)}
  need.sort((a,b)=>(pri.has(b)-pri.has(a))||(!!C[a].dAt-!!C[b].dAt)||sc2(b)-sc2(a));
  let ok=0,fail=0,done=0,stop=false;
  while(need.length&&!stop&&(S.brapiDiv||M.db.n<lim)){const t=need.shift();
    status(`Proventos da carteira: ${++done} consultados · ${ok} obtidos · ${fail} falhas · ${need.length} na fila`);
    try{if(S.brapiDiv)merge(t,await viaRetry(()=>fetchOne(t,true)));
      else{const d=await viaRetry(()=>fetchDivDB(t));C[t].div=d;C[t].dAt=Date.now();C[t].dsrc="dadosb3.com"}
      ST[t]={...(ST[t]||{}),dv:{s:"ok",at:Date.now()}};ok++}
    catch(e){const s=e.s||"neterr";ST[t]={...(ST[t]||{}),dv:{s,at:Date.now(),err:e.message}};M.err={msg:t+": "+e.message,src:S.brapiDiv?"brapi.dev":"dadosb3.com",at:Date.now(),s};fail++;if(s=="limit"||s=="auth")stop=true}
    await sleep(sc.gap)}
  if(ok)M.dAt=Date.now();
  return{ok,fail,left:need.length}}
function filaDetalhe(o,kind){
  const now=Date.now(),H=3.6e6,pos=[...new Set(S.pos.map(p=>p.t))].filter(t=>C[t]);
  const velho=(t,h)=>!C[t].detAt||now-C[t].detAt>h*H,liqOK=t=>C[t].p*(C[t].vol||0)>=S.liqMin;
  const G={};rankAll().forEach(x=>(G[x.sec]=G[x.sec]||[]).push(x.t));
  const cand=Object.values(G).flatMap(L=>L.slice(0,S.nSet));
  const q=[...pos.filter(t=>velho(t,o.force?0:2)),...cand.filter(t=>velho(t,kind=="pregao"?2:12))];
  if(kind!="pregao"){const rest=Object.keys(C).filter(t=>C[t].sec&&liqOK(t)&&velho(t,S.detHoras));
    rest.sort((a,b)=>((C[a].detAt||0)-(C[b].detAt||0))||((C[b].vol||0)-(C[a].vol||0)));q.push(...rest)}
  return[...new Set(q)]}
async function doRefresh(o){
  const now=Date.now(),sc=S.sched,kind=o.kind||"full",pos=[...new Set(S.pos.map(p=>p.t))];
  if(!o.divOnly&&!o.only&&fimDeSemana()&&M.qAt>=lastClose()){status("Mercado fechado: a B3 não opera no fim de semana. Exibindo o fechamento de "+fmtDia(lastClose())+"; as atualizações voltam na segunda-feira.");await sleep(2500);return}
  if(o.manual&&!o.only&&now-M.lastTry<sc.minManual*60000){status(`Aguarde ${Math.ceil((sc.minManual*60000-(now-M.lastTry))/1000)}s: intervalo mínimo entre atualizações manuais.`);await sleep(2500);return}
  let ok=0,fail=0,listFail=false,fila=[],feitas=0;
  if(!o.divOnly&&!o.only){M.lastTry=now;status("Buscando a lista e as cotações do mercado…");
    try{await viaRetry(fetchList);ok++;ST.__lista={s:"ok",at:Date.now()};M.qAt=Date.now()}
    catch(e){ST.__lista={s:e.s||"neterr",at:Date.now(),err:e.message};M.err={msg:"lista do mercado: "+e.message,src:"brapi.dev",at:Date.now(),s:e.s};fail++;listFail=true}}
  if(o.only||listFail){const r=await runIndiv(o.only||[...new Set([...pos,...S.watch])]);ok+=r.ok;fail+=r.fail;if(r.ok&&!o.only)M.qAt=Date.now()}
  const d=await runDiv(o,now);ok+=d.ok;fail+=d.fail;
  if(!o.divOnly&&!o.only&&!listFail){fila=filaDetalhe(o,kind);const r=await runIndiv(fila.slice(0,restanteHoje()));ok+=r.ok;fail+=r.fail;feitas=r.ok+r.fail}
  if(!o.divOnly&&!o.only){const d2=await runDiv(o,now);ok+=d2.ok;fail+=d2.fail}
  if(!o.divOnly&&!o.only)M.skip=ok==0&&fail>0?(nextSlot()||0):0;
  M.ultimo={ok,fail,total:ok+fail,restantes:Math.max(0,fila.length-feitas),at:Date.now()};
}

/* ===== Agendamento (horário de Brasília = UTC-3) ===== */
function slotList(from){const out=[],b=new Date(from-3*36e5);
  for(let d=-8;d<=8;d++){const x=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),b.getUTCDate()+d));
    if(!S.sched.days.includes(x.getUTCDay())||x.getUTCDay()%6==0)continue;
    for(const tm of S.sched.times){const [h,m]=tm.split(":").map(Number);out.push(Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate(),h+3,m||0))}}
  return out.sort((a,b)=>a-b)}
const lastDue=()=>slotList(Date.now()).filter(s=>s<=Date.now()).pop()||0;
const nextSlot=()=>slotList(Date.now()).find(s=>s>Date.now());
function check(){ /* no máximo UMA atualização, mesmo que vários horários tenham sido perdidos */
  if(run||!S.sched.on)return;const ld=lastDue();
  if(ld&&M.qAt<ld&&Date.now()>=(M.skip||0)&&Date.now()-M.lastTry>60000)refresh({sched:true,kind:brt(ld).getUTCHours()>=18?"pos":"pregao"})}

    if(ex=="dados incompletos")d.aguard++;else{d.analisadas++;if(ex=="lucro negativo")d.prej++;else if(ex=="baixa liquidez")d.liq++;else d.rank++;if(C[x.t].detAt&&C[x.t].detAt<lim)d.desat++}}

const VAZIO=()=>`<div class="cd">${Object.keys(C).length?"Ainda sem ações analisadas. A análise avança aos poucos, dentro do orçamento de chamadas.":"Sem dados ainda. Toque em Atualizar agora."}</div>`;
function drawTop(){const A=rankAll(),L=A.slice(0,20),E=A.filter(x=>x.exc);
  $("#m").innerHTML=`<h2>As 20 melhores do mercado</h2><div class="bar">${rkSel()}</div>${covBox()}${E.length?`<div class="box" style="border:1px solid var(--gold)"><h3>🔥 Oportunidades excepcionais (${E.length})</h3>${E.slice(0,10).map(x=>row(x.t+" · "+sp(x.sec),`margem ${P(x.margem)} · ${R(x.p)}`)).join("")}</div>`:""}<div class="grid">${L.map((x,i)=>cardEmp(x,i+1)).join("")||VAZIO()}</div>`;bindRk(drawTop)}
function drawSet(){const G={},T={};
  for(const t in C){const k=sp(C[t].sec);(T[k]=T[k]||new Set()).add(EMP(t))}
  rankAll(true).forEach(x=>(G[sp(x.sec)]=G[sp(x.sec)]||[]).push(x));
  const secs=Object.keys(T).sort((a,b)=>((G[b]||[])[0]?.[S.rk]??-1)-((G[a]||[])[0]?.[S.rk]??-1));
  $("#m").innerHTML=`<h2>Melhores por setor</h2><div class="bar">${rkSel()}<select id="ns">${[3,5,7,10].map(n=>`<option value="${n}">Top ${n} por setor</option>`).join("")}</select></div>${covBox()}`+
    (secs.map(n=>`<h3 style="margin:18px 0 10px;color:var(--ac)">${n} <small>(${(G[n]||[]).length} no ranking · ${T[n].size} empresas)</small></h3><div class="grid">${(G[n]||[]).slice(0,S.nSet).map((x,i)=>cardEmp(x,i+1)).join("")||`<div class="cd">Aguardando a análise das ações deste setor.</div>`}</div>`).join("")||VAZIO());
  bindRk(drawSet);$("#ns").value=S.nSet;$("#ns").onchange=e=>{S.nSet=+e.target.value;save();drawSet()}}
let fSec="",fQ="";
function drawAll(){const L0=rankAll(true),secs=[...new Set(L0.map(x=>sp(x.sec)))].sort();
  $("#m").innerHTML=`<h2>Todas do mercado</h2><div class="bar">${rkSel()}<select id="fs"><option value="">Todos os setores</option>${secs.map(n=>`<option>${n}</option>`).join("")}</select><input id="fq" placeholder="Buscar ticker ou nome" style="flex:1;min-width:160px"></div>${covBox()}<p class="n">Inclui também as ações acima do preço teto.</p><div class="w"><table id="tb"></table></div>`;
  const t=()=>{const q=fQ.toUpperCase(),L=L0.filter(x=>(!fSec||sp(x.sec)==fSec)&&(!q||x.t.includes(q)||(x.nome||"").toUpperCase().includes(q)));
    $("#tb").innerHTML=`<tr><th>#</th><th>Ativo</th><th>Setor</th><th>Cotação</th><th>Teto</th><th>Ideal</th><th>Mínimo 52s</th><th>Margem</th><th>P/L</th><th>DY médio</th><th>ROE</th><th>P/VP</th><th>Nota</th><th>Sinal</th></tr>`+
      (L.map((x,i)=>`<tr><td>${i+1}</td><td><div style="display:flex;gap:10px;align-items:center">${logo(x.t,40)}<div><b style="text-transform:uppercase">${x.exc?"🔥 ":""}${nm(x.t)}</b><br><small>${x.t}</small></div></div></td><td>${sp(x.sec)}</td><td>${R(x.p)}</td><td>${R(x.teto)}</td><td>${R(x.ideal)}</td><td>${R(x.min)}</td><td class="${cls(x.margem)}">${P(x.margem)}</td><td>${fp(x.pl)}</td><td>${x.dym==null?"-":P(x.dym)}</td><td>${x.roe==null?"-":P(x.roe)}</td><td>${x.pvp==null?"-":fp(x.pvp)}</td><td>${x.nota.toFixed(0)}</td><td><span class="pill ${x.s}">${TX[x.s]}</span></td></tr>`).join("")||`<tr><td colspan=14>Nada encontrado.</td></tr>`)};
  bindRk(drawAll);$("#fs").value=fSec;$("#fq").value=fQ;$("#fs").onchange=e=>{fSec=e.target.value;t()};$("#fq").oninput=e=>{fQ=e.target.value;t()};t()}
const dBR=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"informe a data";
const hoje=()=>new Date().toISOString().slice(0,10);
function recebido(q){const c=C[q.t];if(!c||!c.div||!q.d)return null;
  return c.div.filter(x=>x.d&&String(x.d).slice(0,10)>=q.d&&String(x.d).slice(0,10)<=hoje()).reduce((a,x)=>a+x.v*q.q,0)}
function drawCart(){
  let inv=0,atu=0,rec=0;
  const cards=S.pos.map((q,i)=>{const x=calc(q.t),p=x?x.p:null,v=p?p*q.q:null,c=q.q*q.pm,g=v==null?null:v-c,r=recebido(q);
    inv+=c;if(v)atu+=v;if(r)rec+=r;
    let s="m",txt="Manter";
    if(x&&!x.sd){if(x.p>x.teto){s="v";txt="Vender: acima do teto"}else if(S.lucro&&g/c*100>=S.lucro){s="a";txt="Realizar lucro"}else if(x.p<=x.ideal){s="c";txt="Comprar mais"}}
    return`<div class="cd"><div class="hd">${logo(q.t,56)}<div style="min-width:0"><b class="nm">${nm(q.t)}</b><span class="tk">${q.t}</span> <span class="pill ${s}">${txt}</span><br><small>Compra em ${dBR(q.d)}</small></div><span style="flex:1"></span><button class="btn" style="background:#5b6275;color:#fff;padding:4px 10px" data-d="${i}">×</button></div>
    ${row("Quantidade",q.q)}${row("Preço pago",R(q.pm))}${row("Cotação",R(p))}${row("Valor atual",R(v))}
    ${row("Ganho de capital",`<b class="${cls(g)}">${R(g)} ${g==null?"":`(${P(g/c*100)})`}</b>`)}
    ${row("Proventos desde a compra",r==null?"-":R(r))}
    ${row("Retorno total",g==null||r==null?"-":`<b class="${cls(g+r)}">${R(g+r)} (${P((g+r)/c*100)})</b>`)}
    ${row("Preço teto",x&&!x.sd?R(x.teto):"-")}${row("Preço ideal",x&&!x.sd?R(x.ideal):"-")}${x&&!x.sd?row("Margem de segurança",`<b class="${cls(x.margem)}">${P(x.margem)}</b>`):""}${x?indRows(x):""}</div>`}).join("");
  const g=atu-inv;
  $("#m").innerHTML=`<h2>Minha carteira</h2>
  <div class="kp"><div><small>Investido</small><b>${R(inv)}</b></div><div><small>Valor atual</small><b>${R(atu)}</b></div><div><small>Ganho de capital</small><b class="${cls(g)}">${R(g)}</b><small>${inv?P(g/inv*100):""}</small></div><div><small>Proventos desde as compras</small><b>${R(rec)}</b></div><div><small>Retorno total</small><b class="${cls(g+rec)}">${R(g+rec)}</b><small>${inv?P((g+rec)/inv*100):""}</small></div></div>
  <div class="box"><h3>Cadastrar compra</h3><form id="f" class="bar" style="margin:0"><label>Ticker<input id="ft" placeholder="KLBN4" required style="width:100px"></label><label>Quantidade<input id="fq" type="number" min="1" required style="width:100px"></label><label>Preço pago (R$)<input id="fp" type="number" step="0.01" min="0" required style="width:120px"></label><label>Data da compra<input id="fd" type="date" max="${hoje()}" required></label><button class="btn" style="align-self:end">Adicionar</button></form>
  <p class="n">Cada compra é um lote. Os proventos contam a partir da data da compra, pela data-com (valor bruto).</p></div>
  <h3>Minhas compras</h3><div class="grid">${cards||`<div class="cd">Cadastre as ações que você comprou, com a data, para acompanhar ganhos e a renda.</div>`}</div>`;
  $("#f").onsubmit=async e=>{e.preventDefault();const t=$("#ft").value.trim().toUpperCase();
    S.pos.push({t,q:+$("#fq").value,pm:+$("#fp").value,d:$("#fd").value});save();draw();await refresh({only:[t]})};
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(confirm("Remover esta compra?")){S.pos.splice(+b.dataset.d,1);save();draw()}});
}

function drawRenda(){
  const now=new Date(),lots=S.pos.filter(q=>q.d),sem=S.pos.length-lots.length;
  if(!lots.length){$("#m").innerHTML=`<h2>Fluxo de renda</h2><div class="box">Cadastre suas compras com a data na aba Carteira. A renda é calculada a partir da data de cada compra.${sem?` (${sem} compra(s) sem data não entram aqui.)`:""}</div>`;return}
  const first=lots.map(q=>q.d).sort()[0],fd=new Date(first+"T12:00:00");
  const meses=Math.max(1,(now.getFullYear()-fd.getFullYear())*12+now.getMonth()-fd.getMonth()+1),nm=Math.min(Math.max(meses,6),36);
  const Mo=[];for(let i=nm-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);Mo.push({k:d.getFullYear()*12+d.getMonth(),n:d.toLocaleDateString("pt-BR",{month:"short"}),v:0})}
  const lim12=new Date(now.getFullYear(),now.getMonth()-11,1);let tot=0,t12=0,inv=0,atu=0;const por={};
  lots.forEach(q=>{inv+=q.q*q.pm;const x=calc(q.t);if(x)atu+=x.p*q.q;
    ((C[q.t]||{}).div||[]).forEach(y=>{const ds=String(y.d||"").slice(0,10);if(!ds||ds<q.d||ds>hoje())return;const dt=new Date(ds+"T12:00:00"),v=y.v*q.q;
      tot+=v;if(dt>=lim12)t12+=v;por[q.t]=(por[q.t]||0)+v;const m=Mo.find(m=>m.k==dt.getFullYear()*12+dt.getMonth());if(m)m.v+=v})});
  const mx=Math.max(1,...Mo.map(m=>m.v)),g=atu-inv;
  $("#m").innerHTML=`<h2>Fluxo de renda</h2><div class="kp"><div><small>Recebido desde as compras</small><b>${R(tot)}</b></div><div><small>Média mensal (desde ${dBR(first)})</small><b>${R(tot/meses)}</b></div><div><small>Últimos 12 meses</small><b>${R(t12)}</b></div><div><small>Yield sobre o custo</small><b>${inv?P(tot/inv*100):"-"}</b></div><div><small>Resultado total (capital + proventos)</small><b class="${cls(g+tot)}">${R(g+tot)}</b></div></div>
  <div class="row"><div class="box" style="flex:2"><h3>Proventos por mês</h3><div class="chart">${Mo.map(m=>`<div>${m.v?R(m.v).replace("R$ ",""):""}<i style="height:${m.v/mx*80}%"></i>${m.n}</div>`).join("")}</div></div>
  <div class="box"><h3>Por ativo</h3>${Object.entries(por).sort((a,b)=>b[1]-a[1]).map(([t,v])=>row(t,R(v))).join("")||"<small>Nenhum provento com data-com depois das suas compras.</small>"}</div></div>
  <p class="n">Considera a quantidade de cada compra e só proventos com data-com a partir da data dela (valor bruto; datas por data-com, não de pagamento).${sem?` ${sem} compra(s) sem data ficaram de fora.`:""}</p>`;
}

function pie(it){let a=0;const g=it.map((x,i)=>{const s=a;a+=x.w*100;return`${COL[i%COL.length]} ${s}% ${a}%`}).join(",");
  return`<div class="pie" style="background:conic-gradient(${g||"#555 0 100%"})"></div><div style="display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center">${it.map((x,i)=>`<span class="lg"><i style="background:${COL[i%COL.length]}"></i>${x.t}: ${P(x.w*100)}</span>`).join("")}</div>`}
function drawRec(){
  const ag={};S.pos.forEach(q=>{const x=calc(q.t);if(x&&!x.sd)ag[q.t]={t:q.t,val:(ag[q.t]?ag[q.t].val:0)+x.p*q.q,nota:x.nota,margem:x.margem}});
  const pos=Object.values(ag),tv=pos.reduce((a,b)=>a+b.val,0),A=pos.map(p=>({t:p.t,w:p.val/tv,nota:p.nota,margem:p.margem}));
  const Rc=rankAll().filter(x=>x.s=="c").slice(0,10),wr=Rc.length?1/Rc.length:0,B=Rc.map(x=>({t:x.t,w:wr,nota:x.nota,margem:x.margem}));
  const med=(L,k)=>L.reduce((a,x)=>a+x.w*x[k],0),out=A.filter(a=>!Rc.find(r=>r.t==a.t)).map(a=>a.t),inn=Rc.filter(r=>!A.find(a=>a.t==r.t)).map(r=>r.t);
  $("#m").innerHTML=`<h2>Carteira atual x recomendada</h2><p class="n">Recomendada: até 10 ações com sinal COMPRAR e maior nota, pesos iguais.</p>
  <div class="row"><div class="box"><h3>Carteira atual</h3><span class="dy">${tv?`Nota média ${med(A,"nota").toFixed(0)} · margem ${P(med(A,"margem"))}`:"-"}</span>${tv?pie(A):`<p class="n">Cadastre compras na aba Carteira.</p>`}</div>
  <div class="box"><h3>Carteira recomendada</h3><span class="dy up">${Rc.length?`Nota média ${med(B,"nota").toFixed(0)} · margem ${P(med(B,"margem"))}`:"Sem ações com sinal COMPRAR agora"}</span>${pie(B)}</div></div>
  <div class="box"><h3>Ajustes sugeridos</h3><p>Entrar: ${inn.join(", ")||"nenhuma"}</p><p>Reavaliar ou reduzir: ${out.join(", ")||"nenhuma"}</p><p class="n">Antes de comprar ou vender, avalie cada empresa e decida conforme seu perfil. Não é recomendação de investimento.</p></div>`;
}
function drawCfg(){
  $("#m").innerHTML=`<h2>Ajustes</h2><div class="box"><h3>Fonte de dados</h3><label>Token brapi (já vem preenchido por padrão)<input id="c0" value="${S.token}" placeholder="usando o token padrão"></label></div>
  <div class="box"><h3>Critérios de cálculo</h3><div class="bar"><label>P/L alvo (teto = lucro por ação × P/L)<input id="c1" type="number" step="0.5" value="${S.plAlvo}"></label><label>Desconto p/ preço ideal (%)<input id="c2" type="number" value="${S.desc}"></label><label>Anos de histórico de proventos<input id="c3" type="number" min="1" max="10" value="${S.anos}"></label><label>Meta de lucro p/ vender (%)<input id="c4" type="number" value="${S.lucro}"></label></div></div>
  <div class="box"><h3>Ações prioritárias (recebem dividendos primeiro)</h3><textarea id="c5" style="width:100%;min-height:90px">${S.watch.join(" ")}</textarea></div>
  ${brBox()}${divBox()}${schedBox()}${diagBox()}<div class="bar"><button class="btn" id="sv">Salvar e atualizar</button><button class="btn" style="background:#5b6275;color:#fff" id="ex">Exportar backup</button><button class="btn" style="background:#5b6275;color:#fff" id="im">Importar backup</button></div>`;
  bindSched();$("#sv").onclick=()=>{S.token=$("#c0").value.trim();S.dbKey=$("#d0").value.trim();S.dbLim=+$("#d2").value||190;S.brLim=+$("#b0").value||15000;S.liqMin=+$("#b1").value||0;S.brapiDiv=$("#d1").checked;S.plAlvo=+$("#c1").value||10;S.desc=+$("#c2").value||0;S.anos=+$("#c3").value||5;S.lucro=+$("#c4").value||0;
    S.watch=[...new Set($("#c5").value.toUpperCase().split(/[\s,;]+/).filter(Boolean))];save();refresh({})};
  $("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="radar-backup.json";a.click()};
  $("#im").onclick=()=>{const i=document.createElement("input");i.type="file";i.onchange=async()=>{try{S=Object.assign(defS(),JSON.parse(await i.files[0].text()));delete S.cache;save();draw()}catch(e){alert("Arquivo inválido")}};i.click()};
}
const V={top:drawTop,set:drawSet,all:drawAll,cart:drawCart,renda:drawRenda,rec:drawRec,cfg:drawCfg};
function draw(){document.body.dataset.vis=S.vis||"lista";V[view]();
  document.querySelectorAll("[data-v]").forEach(a=>{const v=a.dataset.v,inv=["top","set","all","cart","renda"].includes(view);
    a.classList.toggle("on",a.closest("#sub")?v==view:(v==view||(v=="top"&&inv)))});
  $("#sub").classList.toggle("hide",!["top","set","all","cart","renda"].includes(view))}
document.querySelectorAll("[data-v]").forEach(a=>a.onclick=()=>{view=a.dataset.v;draw();scrollTo(0,0)});
$("#upd").onclick=()=>refresh({manual:true,force:true});
(async()=>{
  try{DB=await idb();idbOk=true}catch(e){}
  if(idbOk){const c=await kvGet("cache"),m=await kvGet("meta");if(c){C=c;for(const t in C)if(C[t].sec=="Outros")delete C[t].sec}if(m){ST=m.ST||{};M=Object.assign(M,m.M)}}
  if(!Object.keys(C).length&&legacy){for(const t in legacy){C[t]={...legacy[t],qAt:legacyAt,dAt:legacyAt};ST[t]={s:"ok",at:legacyAt}}M.qAt=M.dAt=legacyAt||0;persist()}
  draw();status();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(!Object.keys(C).length)refresh({first:true});else refresh({divOnly:true}).then(check);
  setInterval(check,30000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)check()});
  addEventListener("online",check);
})();
</script></body></html>
