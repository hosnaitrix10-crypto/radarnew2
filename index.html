<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar Status Invest</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
    .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    input, select { padding: 8px 12px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #f8fafc; }
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px 12px; border-bottom: 1px solid #334155; text-align: left; font-size: 14px; }
    th { background: #020617; color: #94a3b8; }
    .ok { color: #4ade80; font-weight: bold; }
    .nodata { color: #facc15; }
    .neterr, .limit { color: #f87171; }
    a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Radar — Status Invest</h1>
  <div id="resumo" style="margin-bottom: 14px; color: #94a3b8;">Carregando dados.json...</div>

  <div class="top">
    <input id="busca" type="text" placeholder="Filtrar ticker (ex.: PETR4, MXRF11)..." />
    <select id="filtroStatus">
      <option value="all">Todos os status</option>
      <option value="ok">ok</option>
      <option value="nodata">nodata</option>
      <option value="neterr">neterr</option>
      <option value="limit">limit</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Tipo</th>
        <th>Status</th>
        <th>Indicadores extraídos</th>
        <th>Link</th>
      </tr>
    </thead>
    <tbody id="corpo"></tbody>
  </table>

  <script>
    let todosItens = [];

    function resumirIndicadores(dataObj) {
      if (!dataObj || typeof dataObj !== "object") return "-";
      const chaves = Object.keys(dataObj);
      if (!chaves.length) return "-";
      return chaves.slice(0, 5).map(k => `${k}: ${dataObj[k]?.raw ?? "-"}`).join(" | ");
    }

    function renderizar() {
      const q = document.getElementById("busca").value.trim().toUpperCase();
      const st = document.getElementById("filtroStatus").value;
      const corpo = document.getElementById("corpo");

      const filtrados = todosItens.filter(item => {
        const matchTicker = !q || item.ticker.includes(q);
        const matchStatus = st === "all" || item.status === st;
        return matchTicker && matchStatus;
      });

      corpo.innerHTML = filtrados.map(item => `
        <tr>
          <td><strong>${item.ticker}</strong></td>
          <td>${item.type || "-"}</td>
          <td class="${item.status || ""}">${item.status || "-"}</td>
          <td>${resumirIndicadores(item.data)}</td>
          <td>${item.url ? `<a href="${item.url}" target="_blank" rel="noopener">Abrir</a>` : "-"}</td>
        </tr>
      `).join("");
    }

    async function carregar() {
      const res = await fetch(`./dados.json?t=${Date.now()}`);
      const json = await res.json();
      const stats = json.stats || {};
      document.getElementById("resumo").textContent =
        `Atualizado em: ${json.updatedAt || "-"} | Total: ${stats.total ?? 0} | OK: ${stats.ok ?? 0} | Sem dados: ${stats.nodata ?? 0} | Erro rede: ${stats.neterr ?? 0} | Limite: ${stats.limit ?? 0}`;

      todosItens = Object.values(json.items || {});
      renderizar();
    }

    document.getElementById("busca").addEventListener("input", renderizar);
    document.getElementById("filtroStatus").addEventListener("change", renderizar);
    carregar();
  </script>
</body>
</html>
